# conda env create -f environment.yml && conda activate blitzkugel
name: blitzkugel
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - scipy>=1.11
  - pyvista>=0.43
  - pyvistaqt>=0.11
  - ocp>=7.7          # OpenCascade-Bindings (Paket "cadquery-ocp" bei pip)
  - pytest>=7
  - pip
  - pip:
      - PyQt6>=6.6
      - open3d>=0.18
